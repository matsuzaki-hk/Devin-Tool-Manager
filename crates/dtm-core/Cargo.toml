[package]
name = "dtm-core"
version = "0.4.12"
edition.workspace = true
license.workspace = true
description = "Devin Tool Manager: update engine core library"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "charset"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"
sha2 = "0.10"
globset = "0.4"
regex = "1"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "5"
which = "7"
url = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["keyring"]
keyring = ["dep:keyring"]
